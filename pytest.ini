[pytest]
testpaths = tests
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=apps
    --cov=machine_learning
    --cov-report=term-missing
    --cov-fail-under=70

; ---------------------------------------------------------------------------
; Coverage scope (IMPROVEMENTS.md item 2.8)
;
; --cov is deliberately LIMITED to apps/ and machine_learning/. Those are the
; modules that serve requests and make predictions. The rest of the repo does
; not need coverage:
;   * notebooks/          - exploratory, superseded by scripts/
;   * scripts/            - one-off data prep, run by hand (book1 is the truth)
;   * database/           - thin SQLAlchemy declaration layer
;
; The 70% floor reflects a measured 76% total. The remaining gap is almost
; entirely lines that touch the large artefacts:
;   apps/main.py                     lifespan/_warm_model  -> 1.05 GiB model
;   apps/model_loader.py             real joblib.load calls
;   machine_learning/...py           load_model / load_feature_cols / __main__
; Loading those in a test run violates the "tests never require the model
; artefact" rule, so 76% is near the honest ceiling without a stub model.
; 70 leaves ~6 points of headroom: ordinary refactors pass, deleting a test
; file fails.
; ---------------------------------------------------------------------------
